spring.application.name=logistica-envios

# H2 en memoria: se recrea en cada arranque y se carga con data.sql
spring.datasource.url=jdbc:h2:mem:logistica;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# No hay login: el operador que queda registrado en cada recolección (RN-08) se toma de aquí
logistica.usuario-operador=operador.demo

# Sesión solo por cookie (evita ;jsessionid en las URL)
server.servlet.session.tracking-modes=cookie
