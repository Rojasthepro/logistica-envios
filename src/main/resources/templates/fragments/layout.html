<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · Logística de envíos'">Logística de envíos</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header th:fragment="cabecera(activo)" class="cabecera">
    <div class="contenedor cabecera__fila">
        <a class="marca" th:href="@{/}">Logística de envíos</a>
        <nav class="menu" aria-label="Navegación principal">
            <a th:href="@{/recolecciones/nueva}" th:classappend="${activo == 'recolecciones'} ? 'activo'">Nueva recolección</a>
            <a th:href="@{/remitentes}" th:classappend="${activo == 'remitentes'} ? 'activo'">Remitentes</a>
            <a th:href="@{/h2-console}" target="_blank" rel="noopener">Consola H2</a>
        </nav>
        <span class="operador">Operador: operador.demo</span>
    </div>
</header>

</body>
</html>
