<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · Logística de envíos'">Logística de envíos</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header th:fragment="cabecera(activo)" class="cabecera">
    <div class="contenedor cabecera__fila">
        <div class="cabecera__izquierda">
            <a class="marca" th:href="@{/}">
                <span class="marca__icono" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                        <line x1="12" y1="22.08" x2="12" y2="12"></line>
                    </svg>
                </span>
                <span class="marca__textos">
                    <span class="marca__titulo">Logística de Envíos</span>
                    <span class="marca__subtitulo">Gestión de Recolecciones · Variante A</span>
                </span>
            </a>
        </div>

        <nav class="menu" aria-label="Navegación principal">
            <a th:href="@{/recolecciones/nueva}" th:classappend="${activo == 'recolecciones'} ? 'activo'">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="1" y="3" width="15" height="13" rx="2"></rect>
                    <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
                    <circle cx="5.5" cy="18.5" r="2.5"></circle>
                    <circle cx="18.5" cy="18.5" r="2.5"></circle>
                </svg>
                <span>Nueva recolección</span>
            </a>
            <a th:href="@{/remitentes}" th:classappend="${activo == 'remitentes'} ? 'activo'">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                <span>Remitentes</span>
            </a>
            <a th:href="@{/h2-console}" target="_blank" rel="noopener" class="menu__aux" title="Abrir consola de base de datos H2">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                    <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
                    <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
                </svg>
                <span>BD H2</span>
            </a>
        </nav>

        <div class="cabecera__operador" title="Operador activo en terminal">
            <span class="punto-activo" aria-hidden="true"></span>
            <span class="operador__etiqueta">Operador:</span>
            <code class="operador__codigo">operador.demo</code>
        </div>
    </div>
</header>

<footer th:fragment="pie" class="pie">
    <div class="contenedor pie__fila">
        <span><strong>Sistema de Logística de Envíos</strong> · Ingeniería de Software II</span>
        <span class="pie__reglas">Trazabilidad activa: <code>RN-01</code> a <code>RN-08</code> · Transacción ACID</span>
    </div>
</footer>
</body>
</html>
