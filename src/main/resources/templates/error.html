<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<header th:replace="~{fragments/layout :: cabecera('')}"></header>
<main class="contenedor contenedor--angosto">
    <h1 th:text="${status == 404} ? 'Página no encontrada' : 'Ocurrió un error'">Error</h1>
    <p class="alerta alerta--error"
       th:text="${status == 404} ? 'El recurso solicitado no existe.' : 'No fue posible completar la operación. Intente de nuevo.'"></p>
    <div class="botones">
        <a class="boton" th:href="@{/recolecciones/nueva}">Ir a Nueva recolección</a>
        <a class="boton boton--secundario" th:href="@{/remitentes}">Ver remitentes</a>
    </div>
</main>
</body>
</html>
